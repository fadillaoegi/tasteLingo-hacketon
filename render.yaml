# Render Blueprint: one Docker web service. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: tastelingo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QLOO_MODE
        value: live
      - key: LLM_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.6-flash
      - key: STORE_MODE
        value: postgres
